<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Universal Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Body Styling */
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #74ebd5, #acb6e5);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      /* Table Styling */
      table {
        width: 80%;
        max-width: 700px;
        border-collapse: collapse;
        background-color: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      /* Table Header */
      thead {
        background-color: #2c3e50;
        color: white;
      }

      th {
        padding: 16px;
        font-size: 17px;
        text-align: left;
      }

      /* Table Data */
      td {
        padding: 15px 16px;
        font-size: 15px;
        color: #333;
        border-bottom: 1px solid #ddd;
      }

      /* Alternate Row Colors */
      tbody tr:nth-child(even) {
        background-color: #f2f6fc;
      }

      /* Hover Effect */
      tbody tr:hover {
        background-color: #dceeff;
        transition: 0.3s ease;
      }

      /* Last Row Border */
      tbody tr:last-child td {
        border-bottom: none;
      }

      /* Mobile Responsive */
      @media (max-width: 480px) {
        table {
          width: 100%;
        }

        th,
        td {
          padding: 12px 8px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Score</th>
          <th>Match</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Virat Kohli</td>
          <td>34</td>
          <td>IPL 2026</td>
        </tr>

        <tr>
          <td>Rohit Sharma</td>
          <td>74</td>
          <td>IPL 2026</td>
        </tr>

        <tr>
          <td>Manish Pandey</td>
          <td>54</td>
          <td>IPL 2026</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
