<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelStud.com - Book your travel to Bali</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Travel Booking Form</h1>
    <form action="">
        <div>
            <label for="name">Name</label>
            <input type="text" name="" id="name" placeholder="Enter your name">
        </div>

        <div>
            <label for="age">Age</label>
            <input type="number" name="" id="age" placeholder="Enter your age">
        </div>

        <div>
            <label for="phoneno">Phone</label>
            <input type="tel" name="" id="phoneno" placeholder="Enter your Phone">
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" name="" id="email" placeholder="Enter your Email">
        </div>

        <div>
            <label for="add">Address</label>
            <textarea name="Address" id="add"></textarea>
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>
</html>
