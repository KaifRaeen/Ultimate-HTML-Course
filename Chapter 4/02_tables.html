<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables - HTML</title>
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-family: Arial, sans-serif;
        text-align: left;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 12px 15px;
        border: 2px solid black;
      }

      th {
        background-color: #e23744;
        color: white;
        text-align: center;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      tr:hover {
        background-color: #ffe5e5;
      }

      td {
        color: #333;
      }

      table {
        border-radius: 8px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>Tables in HTML</h1>
    <table>
      <!-- Head of the table -->
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Salary</th>
        </tr>
      </thead>

      <!-- body of the table -->
      <tbody>
        <tr>
          <td>Kaif</td>
          <td>Software Developer</td>
          <td>$7</td>
        </tr>

        <tr>
          <td>Rohan</td>
          <td>ML Engineer</td>
          <td>$6</td>
        </tr>

        <tr>
          <td>Harry</td>
          <td>Software Helper</td>
          <td>$5</td>
        </tr>

        <tr>
          <td>Shivam</td>
          <td>Web Developer</td>
          <td>$4</td>

        <tr>
          <td>Thank</td>
          <td colspan="2">You</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
